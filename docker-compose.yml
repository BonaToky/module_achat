version: '3.8'
services:
  app:
    build: .
    container_name: module_achat_app
    volumes:
      - ./:/var/www/html
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: modul_achat_laravel_nginx
    depends_on:
      - app  # ← Nginx attend que PHP-FPM soit prêt
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: modul_achat_mysql
    environment:
      MYSQL_DATABASE: projet_laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: toky
      MYSQL_USER: toky
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  mysql_data: